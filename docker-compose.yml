services:
  privacy-guard-proxy:
    build: .
    container_name: privacy-guard-proxy
    restart: unless-stopped
    ports:
      - "9880:9880"   # Claude Code proxy
      - "9881:9881"   # Web UI + REST API
    volumes:
      - ./config.json:/app/config.json
      - ./logs:/app/logs
    environment:
      # Optional: override via env instead of config.json
      # PRIVACY_GUARD_API_PORT: "9881"
      TZ: Europe/Berlin
